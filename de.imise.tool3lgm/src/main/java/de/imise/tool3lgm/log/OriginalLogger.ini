log4j.rootLogger = 3debug,3lgm

# 3lgm Logger initialisieren
log4j.appender.3lgm 	 = org.apache.log4j.RollingFileAppender
log4j.appender.3lgm.File = 3lgm.log

# Maximale Größe der log-Datei
log4j.appender.3lgm.MaxFileSize=100KB
# Max. Zahl der Backups bei voller log-Datei
log4j.appender.3lgm.MaxBackupIndex=1

# Layout der Eintragungen in der log-Datei
log4j.appender.3lgm.layout=org.apache.log4j.PatternLayout
log4j.appender.3lgm.layout.ConversionPattern=%d{dd.MM.yyyy HH:mm:ss} %p %t %c - %m%n

log4j.logger.3lgm = INFO
