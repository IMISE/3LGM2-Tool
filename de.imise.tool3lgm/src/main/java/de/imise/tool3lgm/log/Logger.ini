log4j.rootLogger=ALL,ConsoleApp,DailyApp

log4j.appender.ConsoleApp=org.apache.log4j.ConsoleAppender
log4j.appender.ConsoleApp.layout=org.apache.log4j.PatternLayout
log4j.appender.ConsoleApp.layout.ConversionPattern=%d %p::%c: %m %n
log4j.appender.DailyApp=org.apache.log4j.FileAppender
log4j.appender.DailyApp.file=3lgm.log
log4j.appender.DailyApp.layout=org.apache.log4j.PatternLayout
log4j.appender.DailyApp.layout.ConversionPattern=%d %p::%c: %m %n