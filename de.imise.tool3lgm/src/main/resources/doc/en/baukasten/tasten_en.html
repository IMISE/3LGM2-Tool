<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">

<html>
<head>
	<title>Key combinations</title>
</head>

<body>
<h1>Key combinations</h1>
<table border="1" cellpadding="10" bordercolor="Silver">
	<tr valign="TOP">
		<td>Create new model</td>
		<td>Ctrl + N</td>
	</tr>
	<tr valign="TOP">
		<td>Open model</td>
		<td>Ctrl + O</td>
	</tr>
	<tr valign="TOP">
		<td>Save model</td>
		<td>Ctrl + S</td>
	</tr>
	<tr valign="TOP">
		<td>Undo</td>
		<td>Ctrl + Z</td>
	</tr>
	<tr valign="TOP">
		<td>Redo</td>
		<td>Ctrl + Y</td>
	</tr>
	<tr valign="TOP">
		<td>Help</td>
		<td>F1</td>
	</tr>
	<tr valign="TOP">
		<td>Direct help</td>
		<td>Ctrl + F1</td>
	</tr>
</table>
</body>
</html>
